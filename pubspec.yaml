name: attendly
description: "A new Flutter project."
publish_to: 'none'
version: 2.2.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  path_provider: ^2.1.5
  path: ^1.8.3
  permission_handler: ^12.0.1
  intl: ^0.20.2
  font_awesome_flutter: ^11.0.0
  fl_chart: ^1.0.0
  open_filex: ^4.5.0
  package_info_plus: ^10.2.0
  shared_preferences: ^2.5.4
  flutter_markdown_plus: ^1.0.7
  drift: ^2.30.1
  drift_flutter: ^0.2.8
  flutter_riverpod: ^2.6.1
  collection: ^1.19.1
  anchored_list: ^0.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.30.1
  build_runner: ^2.10.5
  rename: ^3.1.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"

# Native splash: covers the engine start until Flutter draws its first frame.
# Colors match the scaffold background of the light and dark theme.
flutter_native_splash:
  color: "#FAFAFA"
  image: assets/logo.png
  color_dark: "#212121"
  image_dark: assets/logo.png
  android_12:
    image: assets/logo.png
    color: "#FAFAFA"
    image_dark: assets/logo.png
    color_dark: "#212121"
  web: false

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/attendly_docs.pdf
    - assets/changelogs/