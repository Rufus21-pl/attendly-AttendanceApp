name: Manual Android Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release Tag (e.g., v1.0.0)"
        required: true
        type: string
      release_name:
        description: "Release Title (e.g., Version 1.0.0)"
        required: true
        type: string
      description:
        description: "Release Description / Changelog"
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  release-android:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Split-ABI APKs
        run: flutter build apk --release --split-per-abi

      - name: Rename APKs for Release
        run: |
          mkdir -p release-apks
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release-apks/app-release.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release-apks/app-release32bit.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag_name }}
          name: ${{ inputs.release_name }}
          body: ${{ inputs.description }}
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: release-apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}